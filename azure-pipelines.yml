trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - README.md

pool:
  name: "Default" # Pointing to the local agent GhostShell

variables:
  PYTHON_VERSION: "3.12"

steps:
  # Install uv
  - script: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
    displayName: 'Install uv'

  # Instruct uv to install Python 3.12 and sync dependencies
  - script: |
      export PATH="$HOME/.local/bin:$PATH"
      uv python install 3.12
      uv sync
    displayName: 'Install dependencies'

  # Execute linter
  - script: |
      export PATH="$HOME/.local/bin:$PATH"
      uv run --python 3.12 ruff check .
    displayName: 'Lint with ruff'

  # Execute tests
  - script: |
      export PATH="$HOME/.local/bin:$PATH"
      uv run --python 3.12 pytest
    displayName: 'Test with pytest'
